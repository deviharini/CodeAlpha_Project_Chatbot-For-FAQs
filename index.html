<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Internship FAQ Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="chat-container">

        <div class="chat-header">

            <h1>🤖 Internship FAQ Chatbot</h1>

            <p>
                Ask me a question about the internship
            </p>

        </div>


        <div id="chatBox" class="chat-box">

            <div class="message bot-message">

                Hello! 👋
                Ask me anything about the internship.

            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>

</html>
